vmType: vz

cpus: __VM_CPUS__
memory: "__VM_MEMORY__"
disk: "__VM_DISK__"

vmOpts:
  vz:
    rosetta:
      enabled: true
      binfmt: true

images:
  - location: "https://cloud-images.ubuntu.com/jammy/current/jammy-server-cloudimg-arm64.img"
    arch: "aarch64"

mounts:
  - location: "~"
    writable: true
  - location: "/tmp/lima"
    writable: true

networks:
  - socket: "/var/run/socket_vmnet.bridged.__WIFI_INTERFACE__"

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail

      VM_USER="${LIMA_CIDATA_USER}"

      # Install Docker and enable on boot
      curl -fsSL https://get.docker.com | sh
      usermod -aG docker "${VM_USER}"
      systemctl enable docker
      systemctl start docker

      # Install Desktop & VNC
      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      apt-get install -y xfce4 xfce4-goodies tigervnc-standalone-server dbus-x11 xterm

      # Create VNC password and xstartup
      mkdir -p /home/${VM_USER}/.vnc
      echo "__VNC_PASSWORD__" | vncpasswd -f > /home/${VM_USER}/.vnc/passwd
      chmod 600 /home/${VM_USER}/.vnc/passwd
      printf '#!/bin/bash\nunset SESSION_MANAGER\nunset DBUS_SESSION_BUS_ADDRESS\nexec startxfce4\n' \
        > /home/${VM_USER}/.vnc/xstartup
      chmod +x /home/${VM_USER}/.vnc/xstartup
      chown -R ${VM_USER}:${VM_USER} /home/${VM_USER}/.vnc

      # Set Linux user password for VNC unlock screen
      echo "${VM_USER}:__LINUX_PASSWORD__" | chpasswd

      # VNC systemd service
      cat > /etc/systemd/system/vncserver-ros2.service << VNCEOF
      [Unit]
      Description=VNC Remote Desktop for ROS2
      After=network.target

      [Service]
      Type=forking
      User=${VM_USER}
      WorkingDirectory=/home/${VM_USER}
      ExecStart=/usr/bin/vncserver -localhost no -geometry 1920x1080 -depth 24 -rfbauth /home/${VM_USER}/.vnc/passwd :1
      ExecStop=/usr/bin/vncserver -kill :1
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
      VNCEOF

      systemctl daemon-reload
      systemctl enable vncserver-ros2.service
      systemctl start vncserver-ros2.service

      # DDS network tuning
      printf 'net.ipv4.ip_forward=1\nnet.core.rmem_max=2147483647\nnet.core.wmem_max=2147483647\nnet.core.rmem_default=26214400\nnet.core.wmem_default=26214400\n' \
        > /etc/sysctl.d/99-ros2-dds.conf
      sysctl --system

  - mode: user
    script: |
      #!/bin/bash
      set -eux -o pipefail
      echo 'export DISPLAY=:1' >> ~/.bashrc
      echo 'xhost +local: > /dev/null 2>&1' >> ~/.bashrc

